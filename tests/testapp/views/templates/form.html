{% extends  "layout.html" %}
{% block loader %}
    <style>
        .ozon-progress {
            height: 2px;
            background-color: #ede7f6;
        }

        .ozon-progress .progress-bar {
            background-color: #673ab7;
        }
    </style>
{% endblock %}
{% block form %}
    <div class="container">
        <div class="it-hero-card it-hero-bottom-overlapping shadow mb-5 pb-1">

            <div class="col-12 p-0 d-none" id="progress_loader d-none">
                <div class="progress progress-indeterminate ozon-progress">
                    <span class="sr-only">In elaborazione...</span>
                    <div class="progress-bar" role="progressbar"></div>
                </div>
            </div>
            <div class="row">
                {% if builder_mode and not rec_name %}
                    <div class="row container-fluid text-center mt-2">
                        <div class=" col-2 offset-10">
                            <button type="button" id="edit_item" name="edit"
                                    class="btn btn-xs btn-outline-primary builder_action_button">
                                <svg class="icon icon-xs">
                                    <use href="/static/bootstrap-italia/svg/sprites.svg#it-pencil"></use>
                                </svg>
                                <span>Edit Form</span>
                            </button>
                        </div>
                    </div>
                {% endif %}

                <div class="col-10 offset-1 ">

                    <h5 id="title" class="card-title py-3  text-center"></h5>
                    <div id="oform" class="row"></div>
                </div>
            </div>
            <script>
                $(document).ready(function () {


                    function init_ckeditor(form) {
                        if (form && form.editor) {
                            window.form.editor.defaultConfig = {
                                // https://ckeditor.com/docs/ckeditor5/latest/features/toolbar/toolbar.html#extended-toolbar-configuration-format
                                toolbar: {
                                    items: [
                                        'exportPDF', 'exportWord', '|',
                                        'findAndReplace', 'selectAll', '|',
                                        'heading', '|',
                                        'bold', 'italic', 'strikethrough', 'underline', 'code', 'subscript', 'superscript', 'removeFormat', '|',
                                        'bulletedList', 'numberedList', 'todoList', '|',
                                        'outdent', 'indent', '|',
                                        'undo', 'redo',
                                        '-',
                                        'fontSize', 'fontFamily', 'fontColor', 'fontBackgroundColor', 'highlight', '|',
                                        'alignment', '|',
                                        'link', 'insertImage', 'blockQuote', 'insertTable', 'mediaEmbed', 'codeBlock', 'htmlEmbed', '|',
                                        'specialCharacters', 'horizontalLine', 'pageBreak', '|',
                                        'textPartLanguage', '|',
                                        'sourceEditing'
                                    ],
                                    shouldNotGroupWhenFull: true
                                },
                                // Changing the language of the interface requires loading the language file using the <script> tag.
                                // language: 'es',
                                list: {
                                    properties: {
                                        styles: true,
                                        startIndex: true,
                                        reversed: true
                                    }
                                },
                                // https://ckeditor.com/docs/ckeditor5/latest/features/headings.html#configuration
                                heading: {
                                    options: [
                                        {
                                            model: 'paragraph',
                                            title: 'Paragraph',
                                            class: 'ck-heading_paragraph'
                                        },
                                        {
                                            model: 'heading1',
                                            view: 'h1',
                                            title: 'Heading 1',
                                            class: 'ck-heading_heading1'
                                        },
                                        {
                                            model: 'heading2',
                                            view: 'h2',
                                            title: 'Heading 2',
                                            class: 'ck-heading_heading2'
                                        },
                                        {
                                            model: 'heading3',
                                            view: 'h3',
                                            title: 'Heading 3',
                                            class: 'ck-heading_heading3'
                                        },
                                        {
                                            model: 'heading4',
                                            view: 'h4',
                                            title: 'Heading 4',
                                            class: 'ck-heading_heading4'
                                        },
                                        {
                                            model: 'heading5',
                                            view: 'h5',
                                            title: 'Heading 5',
                                            class: 'ck-heading_heading5'
                                        },
                                        {
                                            model: 'heading6',
                                            view: 'h6',
                                            title: 'Heading 6',
                                            class: 'ck-heading_heading6'
                                        }
                                    ]
                                },
                                // https://ckeditor.com/docs/ckeditor5/latest/features/editor-placeholder.html#using-the-editor-configuration
                                placeholder: 'Welcome to CKEditor 5!',
                                // https://ckeditor.com/docs/ckeditor5/latest/features/font.html#configuring-the-font-family-feature
                                fontFamily: {
                                    options: [
                                        'default',
                                        'Arial, Helvetica, sans-serif',
                                        'Courier New, Courier, monospace',
                                        'Georgia, serif',
                                        'Lucida Sans Unicode, Lucida Grande, sans-serif',
                                        'Tahoma, Geneva, sans-serif',
                                        'Times New Roman, Times, serif',
                                        'Trebuchet MS, Helvetica, sans-serif',
                                        'Verdana, Geneva, sans-serif'
                                    ],
                                    supportAllValues: true
                                },
                                // https://ckeditor.com/docs/ckeditor5/latest/features/font.html#configuring-the-font-size-feature
                                fontSize: {
                                    options: [10, 12, 14, 'default', 18, 20, 22],
                                    supportAllValues: true
                                },
                                // Be careful with the setting below. It instructs CKEditor to accept ALL HTML markup.
                                // https://ckeditor.com/docs/ckeditor5/latest/features/general-html-support.html#enabling-all-html-features
                                htmlSupport: {
                                    allow: [
                                        {
                                            name: /.*/,
                                            attributes: true,
                                            classes: true,
                                            styles: true
                                        }
                                    ]
                                },
                                // Be careful with enabling previews
                                // https://ckeditor.com/docs/ckeditor5/latest/features/html-embed.html#content-previews
                                htmlEmbed: {
                                    showPreviews: true
                                },
                                // https://ckeditor.com/docs/ckeditor5/latest/features/link.html#custom-link-attributes-decorators
                                link: {
                                    decorators: {
                                        addTargetToExternalLinks: true,
                                        defaultProtocol: 'https://',
                                        toggleDownloadable: {
                                            mode: 'manual',
                                            label: 'Downloadable',
                                            attributes: {
                                                download: 'file'
                                            }
                                        }
                                    }
                                },
                                // https://ckeditor.com/docs/ckeditor5/latest/features/mentions.html#configuration
                                mention: {
                                    feeds: [
                                        {
                                            marker: '@',
                                            feed: [
                                                '@apple', '@bears', '@brownie', '@cake', '@cake', '@candy', '@canes', '@chocolate', '@cookie', '@cotton', '@cream',
                                                '@cupcake', '@danish', '@donut', '@dragée', '@fruitcake', '@gingerbread', '@gummi', '@ice', '@jelly-o',
                                                '@liquorice', '@macaroon', '@marzipan', '@oat', '@pie', '@plum', '@pudding', '@sesame', '@snaps', '@soufflé',
                                                '@sugar', '@sweet', '@topping', '@wafer'
                                            ],
                                            minimumCharacters: 1
                                        }
                                    ]
                                },
                                // The "super-build" contains more premium features that require additional configuration, disable them below.
                                // Do not turn them on unless you read the documentation and know how to configure them and setup the editor.
                                removePlugins: [
                                    // These two are commercial, but you can try them out without registering to a trial.
                                    // 'ExportPdf',
                                    // 'ExportWord',
                                    'CKBox',
                                    'CKFinder',
                                    'EasyImage',
                                    // This sample uses the Base64UploadAdapter to handle image uploads as it requires no configuration.
                                    // https://ckeditor.com/docs/ckeditor5/latest/features/images/image-upload/base64-upload-adapter.html
                                    // Storing images as Base64 is usually a very bad idea.
                                    // Replace it on production website with other solutions:
                                    // https://ckeditor.com/docs/ckeditor5/latest/features/images/image-upload/image-upload.html
                                    // 'Base64UploadAdapter',
                                    'RealTimeCollaborativeComments',
                                    'RealTimeCollaborativeTrackChanges',
                                    'RealTimeCollaborativeRevisionHistory',
                                    'PresenceList',
                                    'Comments',
                                    'TrackChanges',
                                    'TrackChangesData',
                                    'RevisionHistory',
                                    'Pagination',
                                    'WProofreader',
                                    // Careful, with the Mathtype plugin CKEditor will not load when loading this sample
                                    // from a local file system (file://) - load this site via HTTP server if you enable MathType.
                                    'MathType',
                                    // The following features are part of the Productivity Pack and require additional license.
                                    'SlashCommand',
                                    'Template',
                                    'DocumentOutline',
                                    'FormatPainter',
                                    'TableOfContents'
                                ]
                            };
                        }
                    }


                    function initForm(moduleData) {
                        let jsonForm = moduleData.schema
                        let FormData = moduleData.data
                        document.getElementById('title').innerHTML = jsonForm.title;

                        $(".builder_action_button").on("click", function (e) {
                            gotolink(
                                url = "/builder/" + jsonForm.type + "/" + jsonForm.rec_name
                            );
                        });

                        Formio.createForm(
                            document.getElementById('oform'),
                            jsonForm
                        ).then(function (form) {
                            form.language = "it";
                            form.baseUrl = window.location.origin;
                            form.nosubmit = true;
                            {%  if rec_name %}
                                form.state = "submitted";
                                form.submission = moduleData;
                            {% endif %}
                            init_ckeditor(form);
                            form.on('submit', function (submission) {
                                return Formio.fetch('{{ submit }}', {
                                        body: JSON.stringify(submission),
                                        headers: {
                                            'content-type': 'application/json'
                                        },
                                        method: 'POST',
                                        mode: 'cors',
                                    }
                                ).then(async response => {
                                    form.emit('submitDone', submission);
                                    let data = await response.json()
                                    console.log(data);
                                    if (data.hasOwnProperty("url")) {
                                        gotolink(
                                            url = data.url //+ "?token=" + data.access_token
                                        )
                                    }
                                })
                            });
                        });
                    }

                    let loader = "progress_loader";
                    $.ajax({
                        type: "get",
                        {%  if rec_name %}
                            url: "/schema/{{ form_schema }}/{{ rec_name }}",

                        {% else %}
                            url: "/schema/{{ form_schema }}",
                        {% endif %}
                        headers: {
                            'content-type': 'application/json'
                        },
                        async: true,
                        cache: false,
                        beforeSend: function () {
                            $("#" + loader).removeClass("d-none");
                        },
                        error: function (e) {
                            $("#" + loader).addClass("d-none");
                            alert("Errore Interno contattare Helpdesk \n" + e);
                        },
                        success: function (result) {
                            initForm(result);
                        },
                    });

                });


            </script>
        </div>
    </div>
{% endblock %}
{% block js %}
{% endblock %}
