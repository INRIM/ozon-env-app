{% if identity %}
    <li>
        <div class="list-item">
            <button type="button " id="chk_identity"
                    class="btn btn-outline-dark btn-xs m-2 p-1">
                <svg class="icon icon-sm">
                    <use xlink:href="/static/bootstrap-italia/svg/sprites.svg#it-exchange-circle"></use>
                </svg>
                <span class="sr-only">{{ sector }}, Cambia identita</span>
                <span class="">{{ sector }}</span>
            </button>
        </div>
    </li>

    <script type="application/javascript">


        $("#chk_identity").on('click', function (e) {
            e.preventDefault(); // disable the POST of the form by the submit button
            var obj = {"url": "/client/select_identity"};
            execute_ajax(
                "POST", "/client/modal/action", obj, "global_progress_loader", false
            );

        });

    </script>
{% endif %}
