{% extends  "layout.html" %}
{% block loader %}
    <style>
        .ozon-progress {
            height: 2px;
            background-color: #ede7f6;
        }

        .ozon-progress .progress-bar {
            background-color: #673ab7;
        }
    </style>
{% endblock %}
{% block form %}
    <div class="container">

        <div class="it-hero-card it-hero-bottom-overlapping shadow mb-5 pb-1">

            <div class="col-12 p-0 d-none" id="progress_loader">
                <div class="progress progress-indeterminate ozon-progress">
                    <span class="sr-only">In elaborazione...</span>
                    <div class="progress-bar" role="progressbar"></div>
                </div>
            </div>
            <div class="row">
                <div class="col-2"></div>
                <div class="col-8 ">
                    {% if title %}
                        <h5 class="card-title py-3  text-center">Dashboard</h5>
                    {% endif %}

                    <div id="oform" class="row">{{ token }}</div>

                </div>
                <div class="col-2"></div>
            </div>
        </div>
    </div>
{% endblock %}
{% block js %}
{% endblock %}
