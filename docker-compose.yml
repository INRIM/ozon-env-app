services:
  app:
    image: ozonapp.app:latest
    container_name: ozon-env-app
    env_file:
      - .env
    ports:
      - "7999:8000"
    volumes:
      - ./app:/app/app
      - ./models:/models
      - ./tests:/app/tests
      - ./uv.lock:/app/uv.lock
      - ./plugins:/plugins
    restart: unless-stopped
    networks:
      - ozn-network
    logging:
      options:
        max-size: 10m
        max-file: "3"

  mail_sender:
    image: ozonapp.mail_sender:latest
    build:
      context: ./services/mail_sender
    container_name: ozon-env-mail-sender
    env_file:
      - .env
    environment:
      # MODELS_FOLDER dedicato: il worker legge raw, ma ozon-env init genera
      # comunque i modelli -> dir propria per evitare race con l'app su ./models
      MODELS_FOLDER: /models_mail
    depends_on:
      - ozonenv_app_db
    volumes:
      - ./models:/models
    restart: unless-stopped
    networks:
      - ozn-network
    logging:
      options:
        max-size: 10m
        max-file: "3"

  ozonenv_app_db:
    stdin_open: true  # -i
    tty: true
    image: ozonapp.db
    environment:
      MONGO_INITDB_ROOT_USERNAME: $MONGO_USER
      MONGO_INITDB_ROOT_PASSWORD: $MONGO_PASS
      MONGO_INITDB_DATABASE: $MONGO_DB
    volumes:
      - ./mdbdata:/data/db
      - ./database/dump:/dump
      - ./database/scripts/init_db.js:/docker-entrypoint-initdb.d/init_db.js:ro
    restart: unless-stopped
    networks:
      - ozn-network
    ports:
      - "22222:27017"
    ulimits:
      nofile:
        soft: 64000
        hard: 64000
    logging:
      options:
        max-size: 10m
        max-file: "3"

networks:
  ozn-network:
    external: false
    name: ozn-network
