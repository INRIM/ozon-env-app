services:
  app:
    image: ozonapp.app:latest
    container_name: ozon-env-app
    env_file:
      - .env
    ports:
      - "7999:8000"
    volumes:
      - ./app:/app/app
      - ./models:/models
      - ./tests:/app/tests
      - ./uv.lock:/app/uv.lock
      - ./plugins:/plugins
      - ./uploads:/data/uploads
    restart: unless-stopped
    # `up app` (anche da update.sh) tira su il db. Senza questo, update ricrea
    # solo app e il db resta giu' se non gia' avviato.
    depends_on:
      - ozonenv_app_db
    networks:
      - default
      - camunda
    logging:
      options:
        max-size: 10m
        max-file: "3"

  ozonenv_app_db:
    stdin_open: true  # -i
    tty: true
    image: ozonapp.db
    environment:
      MONGO_INITDB_ROOT_USERNAME: $MONGO_USER
      MONGO_INITDB_ROOT_PASSWORD: $MONGO_PASS
      MONGO_INITDB_DATABASE: $MONGO_DB
    volumes:
      - ./mdbdata:/data/db
      - ./database/dump:/dump
      - ./database/scripts/init_db.js:/docker-entrypoint-initdb.d/init_db.js:ro
    restart: unless-stopped
    networks:
      - default
    # Bind sul solo loopback: l'app raggiunge il db sulla rete Docker
    # interna, questa pubblicazione serve solo per gli strumenti locali
    # (mongosh, Compass). Con "22222:27017" il db, che ha le credenziali
    # root, era esposto su tutte le interfacce dell'host.
    ports:
      - "127.0.0.1:22222:27017"
    ulimits:
      nofile:
        soft: 64000
        hard: 64000
    logging:
      options:
        max-size: 10m
        max-file: "3"

networks:
  default:
    name: ${NETWORK}
  camunda:
    external: true
    name: ${CAMUNDA_NETWORK}