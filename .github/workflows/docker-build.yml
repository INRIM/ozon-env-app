name: Build and push images

on:
  push:
    branches:
      - master
      - "1.0"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - name: app
            dockerfile: Dockerfile
            context: .
            suffix: ""
          - name: db
            dockerfile: database/Dockerfile-mongo
            context: database
            suffix: /db
          - name: mail-sender
            dockerfile: services/mail_sender/Dockerfile
            context: services/mail_sender
            suffix: /mail-sender
          - name: calendar-scheduler
            dockerfile: services/calendar_scheduler/Dockerfile
            context: services/calendar_scheduler
            suffix: /calendar-scheduler
          - name: identity-manager
            dockerfile: services/identity_manager/Dockerfile
            context: services/identity_manager
            suffix: /identity-manager
          - name: keycloak-manager
            dockerfile: manager/keycloak-manager/Dockerfile
            context: manager/keycloak-manager
            suffix: /keycloak-manager
    steps:
      - uses: actions/checkout@v4

      - name: Compute image ref vars
        id: vars
        run: |
          echo "base=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
          echo "short_sha=$(echo '${{ github.sha }}' | cut -c1-8)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.vars.outputs.base }}${{ matrix.suffix }}:${{ steps.vars.outputs.short_sha }}
            ${{ steps.vars.outputs.base }}${{ matrix.suffix }}:latest
