name: Build and push images

on:
  push:
    branches:
      - master
      - "[0-9]+.[0-9]+"

jobs:
  semgrep:
    name: Semgrep SAST
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Run Semgrep
        run: |
          # semgrep ci esce non-zero se trovo finding blocking (config auto
          # = ruleset pubblico, niente SEMGREP_APP_TOKEN richiesto).
          docker run --rm -v "$PWD:/src" -w /src returntocorp/semgrep:1.170.1 \
            semgrep ci --config auto

  trivy:
    name: Trivy vulnerability scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Run Trivy (fs)
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo aquasec/trivy:0.73.0 \
            fs \
            --scanners vuln \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --exit-code 1 \
            .

  build:
    name: Build ${{ matrix.name }}
    needs: [semgrep, trivy]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - name: app
            dockerfile: Dockerfile
            context: .
            suffix: ""
          - name: db
            dockerfile: database/Dockerfile-mongo
            context: database
            suffix: /db
          - name: mail-sender
            dockerfile: services/mail_sender/Dockerfile
            context: services/mail_sender
            suffix: /mail-sender
          - name: calendar-scheduler
            dockerfile: services/calendar_scheduler/Dockerfile
            context: services/calendar_scheduler
            suffix: /calendar-scheduler
          - name: identity-manager
            dockerfile: services/identity_manager/Dockerfile
            context: services/identity_manager
            suffix: /identity-manager
          - name: keycloak-manager
            dockerfile: manager/keycloak-manager/Dockerfile
            context: manager/keycloak-manager
            suffix: /keycloak-manager
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Compute image ref vars
        id: vars
        run: |
          echo "base=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
          echo "short_sha=$(echo '${{ github.sha }}' | cut -c1-8)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.vars.outputs.base }}${{ matrix.suffix }}:${{ steps.vars.outputs.short_sha }}
            ${{ steps.vars.outputs.base }}${{ matrix.suffix }}:latest