# Progetto e container prefissati da STACK_NAME: due istanze di
# ozon-env-app sullo stesso host non devono collidere.
name: ${STACK_NAME:-ozon-env-app}-calendar-scheduler

services:
  calendar_scheduler:
    image: ozonapp.calendar_scheduler:${IMAGE_TAG:-latest}
    build:
      context: .
    container_name: ${STACK_NAME:-ozon-env-app}-calendar-scheduler
    env_file:
      # base generico dello stack, poi override specifico del service.
      - ../../.env
      - path: service.env
        required: false
    volumes:
      - ../../models:/models
      - ../../scheduler_data:/data
    restart: unless-stopped
    networks:
      - default
    logging:
      options:
        max-size: 10m
        max-file: "3"

networks:
  default:
    external: true
    name: ${NETWORK}
