[project]
name = "calendar-scheduler"
version = "0.1.0"
description = "Worker scheduler leggero: legge i task calendar via API e li esegue su schedule (APScheduler), senza systemd ne accesso diretto a Mongo"
readme = "README.md"
requires-python = ">=3.14,<4.0"
dependencies = [
    "ozon-env",
    "apscheduler>=3.10,<4.0",
    "httpx>=0.28,<1.0",
    "sqlalchemy>=2.0,<3.0",
]

[tool.uv]  # nosemgrep: uv-missing-dependency-cooldown -- cooldown bloccherebbe le patch CVE fresh
# CVE trivy HIGH: datamodel-code-generator (transitiva di ozon-env) 0.54
# -> 0.64+ e cryptography 49 -> 50.
override-dependencies = ["datamodel-code-generator>=0.64.0", "cryptography>=50"]

[tool.uv.sources]
ozon-env = { git = "https://github.com/inrim/ozon-env.git", rev = "4.0.2" }

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["calendar_scheduler"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
