[project]
name = "mail-sender"
version = "0.1.0"
description = "Worker pull che svuota la coda message_queue inviando email via SMTP"
readme = "README.md"
requires-python = ">=3.14,<4.0"
dependencies = [
    "ozon-env",
    "jinja2>=3.1",
]

[tool.uv]  # nosemgrep: uv-missing-dependency-cooldown -- cooldown bloccherebbe le patch CVE fresh
# CVE trivy HIGH: datamodel-code-generator (transitiva di ozon-env) 0.54
# -> 0.64+ e cryptography 49 -> 50.
override-dependencies = ["datamodel-code-generator>=0.64.0", "cryptography>=50"]

[tool.uv.sources]
ozon-env = { git = "https://github.com/inrim/ozon-env.git", rev = "4.0.2" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mail_sender"]
