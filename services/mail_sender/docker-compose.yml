# Progetto e container prefissati da STACK_NAME: due istanze di
# ozon-env-app sullo stesso host non devono collidere.
name: ${STACK_NAME:-ozon-env-app}-mail-sender

services:
  mail_sender:
    image: ozonapp.mail_sender:${IMAGE_TAG:-latest}
    build:
      context: .
    container_name: ${STACK_NAME:-ozon-env-app}-mail-sender
    env_file:
      # base generico dello stack, poi override opzionale specifico del service.
      - ../../.env
      - path: service.env
        required: false
    environment:
      MODELS_FOLDER: /models_mail
    volumes:
      - ../../models:/models_mail
    restart: unless-stopped
    networks:
      - default
    logging:
      options:
        max-size: 10m
        max-file: "3"

networks:
  default:
    external: true
    name: ${NETWORK}
