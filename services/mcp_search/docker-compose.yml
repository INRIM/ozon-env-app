# Progetto e container prefissati da STACK_NAME: due istanze di
# ozon-env-app sullo stesso host non devono collidere.
name: ${STACK_NAME:-ozon-env-app}-mcp-search

services:
  mcp_search:
    image: ozonapp.mcp_search:${IMAGE_TAG:-latest}
    build:
      context: .
    container_name: ${STACK_NAME:-ozon-env-app}-mcp-search
    env_file:
      # base generico dello stack, poi env specifico del service (override).
      - ../../.env
      - path: service.env
        required: false
    ports:
      - "${MCP_SEARCH_PUBLISHED_PORT:-8090}:8090"
    restart: unless-stopped
    networks:
      - default
    logging:
      options:
        max-size: 10m
        max-file: "3"

networks:
  default:
    external: true
    name: ${NETWORK}
