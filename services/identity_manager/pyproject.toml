[project]
name = "identity-manager"
version = "0.1.0"
description = "Worker che aggiorna la lista users in group_users in base alle query rule impostate"
readme = "README.md"
requires-python = ">=3.14,<4.0"
dependencies = [
    "ozon-env",
    "PyYAML",
]

[tool.uv.sources]
ozon-env = { git = "https://github.com/inrim/ozon-env.git", rev = "4.0.2" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["identity_manager"]
