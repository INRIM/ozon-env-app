# Progetto e container prefissati da STACK_NAME: due istanze di
# ozon-env-app sullo stesso host non devono collidere.
name: ${STACK_NAME:-ozon-env-app}-identity-manager

services:
  identity_manager:
    image: ozonapp.identity_manager:${IMAGE_TAG:-latest}
    build:
      context: .
    container_name: ${STACK_NAME:-ozon-env-app}-identity-manager
    env_file:
      # base generico dello stack, poi env specifico del service (override).
      - ../../.env
      - path: service.env
        required: false
    environment:
      # MODELS_FOLDER dedicato: evita race con l'app sulla generazione modelli.
      MODELS_FOLDER: /models_identity
    volumes:
      - ../../models:/models_identity
    restart: unless-stopped
    networks:
      - default
    logging:
      options:
        max-size: 10m
        max-file: "2"

networks:
  default:
    external: true
    name: ${NETWORK}
