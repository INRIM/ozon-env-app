[tool.poetry]
name = "ozon-env-app"
version = "1.0.0"
homepage = "https://github.com/archetipo/ozon-env-app"
description = "Ozon Env App"
readme = "README.md"
authors = ["Alessio Gerace <alessio.gerace@gmail.com>"]
license = "MIT"
packages = [{ include = "app/**/*.py" }]
exclude = ["tests/*"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Natural Language :: English",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython"]

[build-system]
requires = ["poetry_core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.dependencies]
python = ">=3.14,<4.0"
ozon-env-api = { git = "https://github.com/INRIM/ozon-env-api.git" }
fastapi = ">=0.136.1"
uvicorn = { version = ">=0.35.0", extras = ["standard"] }
python-dotenv = ">=1.1.1"
pydantic = ">=2.11,<3.0"
pydantic-settings = ">=2.10,<3.0"
pyzeebe = ">=4.5,<5.0"
httpx = ">=0.28,<1.0"
grpcio = ">=1.66,<2.0"
camunda-orchestration-sdk = ">=8.9.0.dev25"


[tool.poetry.group.dev.dependencies]
pytest-asyncio = ">=0.23.4"
pytest-mock = "*"
pytest-mock-server = "*"
pytest-cov = "4.1.0"
flake9 = ">=3.8.3"
isort = ">=5.8.0"
black = { version = "*", allow-prereleases = true }
types-toml = "*"
pytest-html = "*"

[tool.flake8]
max-complexity = 15
max-line-length = 79
extend-ignore = "E203,W293,W291,E211"

[tool.black]
line-length = 79
skip-string-normalization = true
exclude = '(tests/data|\.eggs|\.git|\.hg|\.mypy_cache|\.nox|\.tox|\.venv|_build|buck-out|build|dist|.*\/models\.py.*|.*\/models\/.*)'

[tool.isort]
line_length = 79
include_trailing_comma = true
use_parentheses = true
force_single_line = true
skip = "tests"

[tool.pytest.ini_options]
pythonpath = [
    "."
]
filterwarnings = [
    "error",
    "ignore::UserWarning",
    "ignore::DeprecationWarning",
    # note the use of single quote below to denote "raw" strings in TOML
    'ignore:function ham\(\) is deprecated:DeprecationWarning'
]
markers = [
    "camunda: real Camunda end-to-end tests, opt-in only",
]
asyncio_mode = "auto"

[tool.coverage.report]
ignore_errors = true
exclude_lines = [
    "if self.debug:",
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "if not TYPE_CHECKING:"]

omit = [
    "/tests/*"
]

[tool.uv.sources]
ozon-env = { git = "https://github.com/inrim/ozon-env.git", rev = "4.0.2" }
ozon-env-api = { git = "https://github.com/INRIM/ozon-env-api.git" }
aioclamd = { git = "https://github.com/INRIM/aioclamd.git" }

[project]
name = "ozon-env-app"
version = "1.0.0"
requires-python = ">=3.14,<4.0"
dependencies = [
    "aioclamd",
    "camunda-orchestration-sdk>=9.0.0",
    "fastapi>=0.116.0",
    "grpcio>=1.66,<2.0",
    "httpx>=0.28",
    "itsdangerous>=2.2",
    "ozon-env",
    "ozon-env-api",
    "pyzeebe>=4.5,<5.0",
    "python-dotenv>=1.1.1",
    "uvicorn[standard]>=0.35.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.1.0",
]
