---
- name: Validate requested action
  ansible.builtin.assert:
    that:
      - ozonapp_action in ['build', 'deploy', 'update']
    fail_msg: "ozonapp_action '{{ ozonapp_action }}' non supportata (build/deploy/update)."

# --- Risoluzione contenuti ENV da CI ----------------------------------------
- name: Resolve raw env map from CI variable
  ansible.builtin.set_fact:
    _ozonapp_env_raw: "{{ lookup('ansible.builtin.env', ozonapp_env_vars_env_name) | default('', true) }}"
  when: (ozonapp_env | default({}) | length) == 0

- name: Parse env map from CI variable
  ansible.builtin.set_fact:
    ozonapp_env: "{{ _ozonapp_env_raw | from_yaml }}"
  when:
    - (ozonapp_env | default({}) | length) == 0
    - (_ozonapp_env_raw | default('') | length) > 0

- name: Validate ozonapp_env format
  ansible.builtin.assert:
    that:
      - ozonapp_env is mapping
    fail_msg: "OZONAPP_ENV_VARS deve essere una mappa YAML/JSON (es: APP_CODE: nob-test)."
  when: (ozonapp_env | default({}) | length) > 0

- name: Resolve dotenv content
  ansible.builtin.set_fact:
    _ozonapp_dotenv_content: >-
      {{
        (ozonapp_dotenv_content | default('', true))
        if (ozonapp_dotenv_content | default('', true) | length > 0)
        else (lookup('ansible.builtin.env', ozonapp_dotenv_env_name) | default('', true))
      }}

# --- Sorgenti ----------------------------------------------------------------
- name: Ensure project root exists
  ansible.builtin.file:
    path: "{{ ozonapp_project_root }}"
    state: directory
    mode: "0755"
  when: ozonapp_sync_sources | bool

- name: Checkout/update ozon-env-app repository
  ansible.builtin.git:
    repo: "{{ ozonapp_service_repo }}"
    dest: "{{ ozonapp_app_dir }}"
    version: "{{ ozonapp_service_branch }}"
    update: true
    accept_hostkey: true
  when: ozonapp_sync_sources | bool

# --- Scrittura .env (no-clobber) --------------------------------------------
- name: Write .env from CI raw content
  ansible.builtin.copy:
    dest: "{{ ozonapp_app_dir }}/.env"
    content: "{{ _ozonapp_dotenv_content | trim }}\n"
    mode: "0600"
  when: (_ozonapp_dotenv_content | length) > 0

- name: Write .env from CI env map
  ansible.builtin.template:
    src: env.j2
    dest: "{{ ozonapp_app_dir }}/.env"
    mode: "0600"
  when:
    - (_ozonapp_dotenv_content | length) == 0
    - (ozonapp_env | length) > 0

- name: Check existing .env (no-clobber)
  ansible.builtin.stat:
    path: "{{ ozonapp_app_dir }}/.env"
  register: _ozonapp_existing_env
  when:
    - (_ozonapp_dotenv_content | length) == 0
    - (ozonapp_env | length) == 0

# Copia il fallback SOLO se non esiste gia un .env (mai sovrascrive segreti).
- name: Copy fallback .env when missing
  ansible.builtin.copy:
    src: "{{ ozonapp_app_dir }}/.env.example"
    dest: "{{ ozonapp_app_dir }}/.env"
    mode: "0600"
    remote_src: true
  when:
    - (_ozonapp_dotenv_content | length) == 0
    - (ozonapp_env | length) == 0
    - not (_ozonapp_existing_env.stat.exists | default(false))

# --- Validazioni deploy ------------------------------------------------------
- name: Read resolved .env content for deploy checks
  ansible.builtin.slurp:
    src: "{{ ozonapp_app_dir }}/.env"
  register: _ozonapp_deployed_env
  when:
    - ozonapp_action == 'deploy'
    - ozonapp_validate_deploy_env | bool

- name: Validate required env keys for deploy
  ansible.builtin.assert:
    that:
      - (_ozonapp_dotenv_decoded | regex_search('(?m)^' ~ item ~ '=.+$')) is not none
    fail_msg: "Variabile ENV obbligatoria mancante/vuota in .env: {{ item }}"
  vars:
    _ozonapp_dotenv_decoded: "{{ _ozonapp_deployed_env.content | b64decode }}"
  loop: "{{ ozonapp_required_deploy_env }}"
  when:
    - ozonapp_action == 'deploy'
    - ozonapp_validate_deploy_env | bool

# ============================================================================
# BUILD
# ============================================================================
- name: "[build] uv lock (richiede VPN)"
  ansible.builtin.command:
    argv:
      - uv
      - lock
  args:
    chdir: "{{ ozonapp_app_dir }}"
  when:
    - ozonapp_action == 'build'
    - ozonapp_uv_lock | bool

- name: "[build] Build images (ozonapp.db + ozonapp.app)"
  ansible.builtin.command:
    argv:
      - ./build_imges.sh
  args:
    chdir: "{{ ozonapp_app_dir }}"
  when:
    - ozonapp_action == 'build'
    - ozonapp_build_images | bool

# ============================================================================
# DEPLOY (= build immagini ozon-env-app + docker compose up)
# ============================================================================
- name: "[deploy] Build ozon-env-app images"
  ansible.builtin.command:
    argv:
      - ./build_imges.sh
  args:
    chdir: "{{ ozonapp_app_dir }}"
  when:
    - ozonapp_action == 'deploy'
    - ozonapp_deploy_build | bool

- name: "[deploy] Ensure external docker network exists"
  ansible.builtin.command:
    argv:
      - docker
      - network
      - create
      - "{{ ozonapp_docker_network }}"
  register: _ozonapp_network_create
  changed_when: _ozonapp_network_create.rc == 0
  failed_when:
    - _ozonapp_network_create.rc != 0
    - "'already exists' not in (_ozonapp_network_create.stderr | default(''))"
  when: ozonapp_action == 'deploy'

- name: "[deploy] Start docker compose"
  ansible.builtin.command:
    argv:
      - docker
      - compose
      - -f
      - "{{ ozonapp_compose_file_name }}"
      - up
      - -d
  args:
    chdir: "{{ ozonapp_app_dir }}"
  when: ozonapp_action == 'deploy'

# ============================================================================
# UPDATE
# ============================================================================
- name: "[update] Rebuild images (richiede VPN)"
  ansible.builtin.command:
    argv:
      - ./build_imges.sh
  args:
    chdir: "{{ ozonapp_app_dir }}"
  when:
    - ozonapp_action == 'update'
    - ozonapp_update_build | bool

- name: "[update] Recreate service"
  ansible.builtin.command:
    argv:
      - docker
      - compose
      - -f
      - "{{ ozonapp_compose_file_name }}"
      - up
      - -d
      - --force-recreate
      - "{{ ozonapp_update_service }}"
  args:
    chdir: "{{ ozonapp_app_dir }}"
  when: ozonapp_action == 'update'

# ============================================================================
# HEALTH CHECK
# ============================================================================
- name: Wait app health endpoint
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ ozonapp_app_port }}{{ ozonapp_health_path }}"
    method: GET
    status_code: "{{ ozonapp_health_status_codes }}"
    timeout: 10
  register: _ozonapp_health
  until: _ozonapp_health.status in ozonapp_health_status_codes
  retries: "{{ ozonapp_health_retries }}"
  delay: "{{ ozonapp_health_delay }}"
  when:
    - ozonapp_verify_endpoint | bool
    - ozonapp_action in ['deploy', 'update']
