---
# Azione richiesta: build | deploy | update
ozonapp_action: deploy

# Root del repo (due livelli sopra il playbook) e dir applicativa.
ozonapp_repo_root: "{{ playbook_dir | dirname | dirname }}"
ozonapp_project_root: "{{ ozonapp_repo_root }}"
ozonapp_app_dir: "{{ ozonapp_project_root }}"

# Sorgenti: clone/aggiornamento remoto opzionale (default: in-place).
ozonapp_sync_sources: false
ozonapp_service_repo: "git@gitlab.ininrim.it:inrimsi/microservice/services-apps/ozon-env-app.git"
ozonapp_service_branch: main

# Compose: stack single-project, NESSUN -p (gli script riusati non lo usano).
ozonapp_compose_file_name: docker-compose.yml
ozonapp_app_service: app
ozonapp_db_service: ozonenv_app_db

# --- Gestione .env -----------------------------------------------------------
# 1) contenuto raw da CI (OZONAPP_DOTENV_CONTENT)
# 2) mappa YAML/JSON da CI (OZONAPP_ENV_VARS) -> template env.j2
# 3) nessun contenuto CI: NO-CLOBBER del .env esistente; se assente copia il
#    fallback .env.example (mai sovrascrive un .env con segreti reali).
ozonapp_env_vars_env_name: OZONAPP_ENV_VARS
ozonapp_dotenv_env_name: OZONAPP_DOTENV_CONTENT
ozonapp_env: {}
ozonapp_dotenv_content: ""
# Fallback quando manca un .env e nessun contenuto CI: copia .env.example
# da ozonapp_app_dir (corretto anche in remote/sync_sources).

# --- Build -------------------------------------------------------------------
# uv lock richiede la VPN (ozon-env-api da gitlab): opt-in, default off.
ozonapp_uv_lock: false
# build_imges.sh costruisce ozonapp.db + ozonapp.app + ozonapp.mail_sender +
# ozonapp.calendar_scheduler (richiede VPN, --network host).
ozonapp_build_images: true

# --- Deploy (setup-db + bootstrap) ------------------------------------------
ozonapp_run_setup_db: true
ozonapp_run_bootstrap: true
ozonapp_admin_uid: ""
ozonapp_bootstrap_base_only: false
# In deploy ricostruisce le immagini prima di setup/bootstrap (richiede VPN).
ozonapp_deploy_build: false

# Nota: la configurazione keycloak NON e' piu' nel deploy. Vedi il servizio
# interattivo dedicato manager/keycloak-manager (genera kc-env.var).

# --- Update ------------------------------------------------------------------
ozonapp_update_service: app
# Ricostruisce le immagini (build_imges.sh) prima di ricreare il servizio.
ozonapp_update_build: false

# Chiavi ENV obbligatorie in fase di deploy.
ozonapp_required_deploy_env:
  - APP_CODE
  - MONGO_USER
  - MONGO_PASS
  - MONGO_DB
  - SESSION_SECRET

# --- Health check (opzionale) ------------------------------------------------
# Endpoint pubblico non autenticato (/openapi.json), NON /dashboard (sotto auth).
ozonapp_verify_endpoint: true
ozonapp_app_port: 7999
ozonapp_health_path: /openapi.json
ozonapp_health_status_codes:
  - 200
  - 301
  - 302
  - 401
  - 403
ozonapp_health_retries: 10
ozonapp_health_delay: 3
