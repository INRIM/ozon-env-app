[project]
name = "keycloak-manager"
version = "0.1.0"
description = "Servizio interattivo per configurare keycloak passo-passo (client app + client M2M -> audience) e generare il file kc-env.var. Agnostico, dockerizzato."
readme = "README.md"
requires-python = ">=3.14,<4.0"
dependencies = [
    "kc-provision",
]

[tool.uv.sources]
kc-provision = { git = "https://github.com/INRIM/kc-provision.git", rev = "1627d61bde4863e6cd034cf7bb0d636603b7ca30" }

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["keycloak_manager"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
